panel.products.title=ProductOData (List binding\: $top/$skip/$orderby/$filter/$count/$select)
product.column.id=id (Edm.Int32)
product.column.nombre=nombre (Edm.String)
product.column.precio=precio (Edm.Decimal)
product.column.categoria=categoria
panel.selected.title=Selected / expanded entity (by-key + $expand category & products)
selection.byKey=by-key /product-odata(1)\:
selection.expandCategory=$expand=category\:
selection.expandProducts=$expand=products($select=id,nombre;$top=2)\:
