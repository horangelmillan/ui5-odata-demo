# =============================================================================
# i18n - UI5 OData V4 Integration Test-Bench
# =============================================================================
# Prefijos semanticos:
#   page.*          — titulos de pagina
#   button.*        — textos de boton
#   panel.*         — encabezados de panel
#   product.*       — strings del dominio demo (product)
#   selection.*     — strings del panel de entidad seleccionada/expandida
#   suite.*         — strings del panel de resultados de test
#   finance.*       — strings de la lista de entidades finance
#   invoice.*       — strings del listado de facturas
#   invoiceDetail.* — strings del detalle de factura
#   customer.*      — strings del listado de clientes
#   customerDetail.*- strings del detalle de cliente
#   payment.*       — strings del listado de pagos
# =============================================================================

# --- Pagina Demo (App.view.xml) ---
page.demo.title=UI5 OData V4 <-> servidor-odata Test-Bench
